<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RADD — Links & actions</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --canvas:#121212; --raised:#1a1a1a; --ink:#f5f2ea; --muted:#a8a49c; --flame-text:rgb(231 61 68); }
  * { margin: 0; box-sizing: border-box; }
  body { background: var(--canvas); color: var(--ink); font-family: Inter, sans-serif; padding: 32px; display: flex; flex-direction: column; gap: 28px; }
  h1 { font-size: 14px; font-family: "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
  .label { width: 130px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted); }
  a { text-decoration: none; }
  .cta { font-family: "JetBrains Mono", monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--flame-text); display: inline-flex; align-items: center; gap: 8px; transition: color 150ms; }
  .cta:hover { color: var(--ink); }
  .cta svg { transition: transform 150ms; }
  .cta:hover svg { transform: translate(3px, -3px); }
  .navlink { font-family: "JetBrains Mono", monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); transition: color 150ms; }
  .navlink:hover { color: var(--flame-text); }
  .navlink.active { color: var(--flame-text); }
  .focus-demo { font-family: "JetBrains Mono", monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink); outline: 2px solid var(--flame-text); outline-offset: 3px; border-radius: 1px; }
  .wordmark { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.02em; color: var(--ink); }
</style>
</head>
<body>
  <h1>RADD / Links &amp; actions</h1>
  <div class="row"><span class="label">Wordmark</span><a class="wordmark" href="#">RADD</a></div>
  <div class="row"><span class="label">Primary CTA</span>
    <a class="cta" href="#">View the work
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M7 7h10v10"/></svg>
    </a></div>
  <div class="row"><span class="label">Nav link</span><a class="navlink" href="#">Photography</a><a class="navlink active" href="#" aria-current="page">Work (active)</a></div>
  <div class="row"><span class="label">Keyboard focus</span><a class="focus-demo" href="#">Focused element</a></div>
</body>
</html>
